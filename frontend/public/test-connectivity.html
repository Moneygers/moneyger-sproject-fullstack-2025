<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Connectivity Test</title>
</head>
<body>
    <h1>API Connectivity Test</h1>
    <div id="results"></div>

    <script>
        const BASE_URL = "http://127.0.0.1:8000";
        const resultsDiv = document.getElementById('results');

        async function testEndpoint(endpoint, method = 'GET') {
            try {
                const response = await fetch(`${BASE_URL}${endpoint}`, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const statusText = response.ok ? 'SUCCESS' : 'FAILED';
                const data = response.ok ? await response.json() : await response.text();
                
                resultsDiv.innerHTML += `
                    <p><strong>${endpoint}</strong>: ${statusText} (${response.status})</p>
                    <pre>${JSON.stringify(data, null, 2).substring(0, 200)}...</pre>
                    <hr>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <p><strong>${endpoint}</strong>: ERROR - ${error.message}</p>
                    <hr>
                `;
            }
        }

        // Test various endpoints
        async function runTests() {
            resultsDiv.innerHTML = '<p>Testing API endpoints...</p>';
            
            await testEndpoint('/api/slots/');
            await testEndpoint('/api/reservations/');
            await testEndpoint('/api/settings/');
            await testEndpoint('/api/parking-rates/');
            await testEndpoint('/api/available-slots/');
            
            resultsDiv.innerHTML += '<p><strong>Tests completed!</strong></p>';
        }

        // Run tests when page loads
        window.onload = runTests;
    </script>
</body>
</html>
